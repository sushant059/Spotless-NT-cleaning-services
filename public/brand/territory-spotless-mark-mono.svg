<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Territory Spotless Cleaning Services">
  <defs>
    <linearGradient id="tsBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8FDB"/><stop offset="1" stop-color="#0F2D4F"/></linearGradient>
    <linearGradient id="tsLeaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#217A3A"/><stop offset="1" stop-color="#3DB863"/></linearGradient>
  </defs>
  <!-- swooshes -->
